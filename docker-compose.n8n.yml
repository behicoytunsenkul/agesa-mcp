# Sadece n8n (SQLite — Postgres'e bağlanmaz)
# docker compose -f docker-compose.n8n.yml up -d

services:
  n8n:
    image: n8nio/n8n:1.82.1
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_SECURE_COOKIE: "false"
      N8N_ENCRYPTION_KEY: agesa-mcp-local-encryption-key-32
      WEBHOOK_URL: http://127.0.0.1:5678/
      GENERIC_TIMEZONE: Europe/Istanbul
      TZ: Europe/Istanbul
      EXECUTIONS_MODE: regular
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - agesa_net

volumes:
  n8n_data:

networks:
  agesa_net:
    external: true
