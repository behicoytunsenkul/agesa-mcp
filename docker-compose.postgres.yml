# PostgreSQL — root / 123456
# docker network create n8n_network
# docker compose -f docker-compose.postgres.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: n8n
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/docker-init-dbs.sh:/docker-entrypoint-initdb.d/01-init-dbs.sh:ro
      - ./scripts/schema.sql:/schemas/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - n8n_network

volumes:
  postgres_data:

networks:
  n8n_network:
    external: true
