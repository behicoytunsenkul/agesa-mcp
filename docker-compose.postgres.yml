# Sadece PostgreSQL
# docker compose -f docker-compose.postgres.yml up -d
# Önce: docker network create agesa_net

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: firma_asistani
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/docker-init-dbs.sh:/docker-entrypoint-initdb.d/01-init-dbs.sh:ro
      - ./scripts/schema.sql:/schemas/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d firma_asistani"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - agesa_net

volumes:
  postgres_data:

networks:
  agesa_net:
    external: true
