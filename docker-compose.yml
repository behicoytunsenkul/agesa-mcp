services:
  postgres:
    image: postgres:16-alpine
    container_name: agesa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: firma_asistani
    ports:
      - "5433:5432"
    volumes:
      - agesa_pgdata:/var/lib/postgresql/data
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d firma_asistani"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - agesa-net

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: agesa-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      WEBHOOK_URL: http://127.0.0.1:5678/
      GENERIC_TIMEZONE: Europe/Istanbul
      TZ: Europe/Istanbul
    volumes:
      - n8n_data:/home/node/.n8n
    # Postgres kapalı olsa bile n8n ayağa kalksın
    depends_on:
      - postgres
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - agesa-net

volumes:
  agesa_pgdata:
  n8n_data:

networks:
  agesa-net:
    driver: bridge
