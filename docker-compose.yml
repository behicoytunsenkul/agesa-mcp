# Bu compose YENİ postgres açmaz.
# Mevcut n8n_network / postgres / redis / n8n konteynerleriniz zaten çalışıyor olmalı.
# İsteğe bağlı: sadece AgeSA Next uygulamasını container olarak koşturmak için.

services:
  agesa-mcp:
    image: node:22-bookworm
    working_dir: /app
    volumes:
      - ./:/app
    command: bash -lc "npm install && npm run build && npm run start"
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://root:123456@postgres:5432/firma_asistani
      N8N_CHAT_URL: http://n8n:5678/webhook/firma-asistani-chat-webhook/chat
    networks:
      - n8n_network
    restart: unless-stopped
    profiles:
      - app

networks:
  n8n_network:
    external: true
