services:
  postgres:
    image: postgres:16-alpine
    container_name: agesa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: n8n
    ports:
      - "5432:5432"
    volumes:
      - agesa_pgdata:/var/lib/postgresql/data
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/01-firma-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: agesa-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://127.0.0.1:5678/
      GENERIC_TIMEZONE: Europe/Istanbul
      TZ: Europe/Istanbul
      # n8n kendi verisini de aynı Postgres'e yazar
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: root
      DB_POSTGRESDB_PASSWORD: "123456"
      DB_POSTGRESDB_SSL_ENABLED: "false"
    volumes:
      - agesa_n8n_data:/home/node/.n8n

volumes:
  agesa_pgdata:
  agesa_n8n_data:
